name: Firestore Rules CI

on:
  pull_request:
    branches:
      - "*"

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-hala-rules --config firebase.json "npm run test:rules"
