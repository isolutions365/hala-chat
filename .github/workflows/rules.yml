name: Firestore Rules CI

on:
  pull_request:
    branches: [ "*" ]

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.31.0
      - run: firebase emulators:exec --config firebase.emulator.json --project demo-hala-rules --only firestore,storage "npm run test:rules"
