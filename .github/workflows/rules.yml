name: Firestore Rules CI

on:
  pull_request:
    branches:
      - "*"

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Create isolated Firestore emulator config
        run: |
          printf '%s\\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8088},"ui":{"enabled":false}}}' > firebase.rules-emulator.json
      - run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-hala-rules --config firebase.rules-emulator.json "npm run test:rules"
