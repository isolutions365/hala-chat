name: Firestore Rules CI

on:
  pull_request:
    branches: [ "*" ]

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: npx --yes firebase-tools emulators:exec --only firestore "bun run test:rules"
