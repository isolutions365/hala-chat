name: Firestore Rules CI

on:
  pull_request:
    branches: [ "*" ]

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The repository's bun.lock is currently out of sync with package.json.
      # Install from package.json so the rules tests can run; sync the lockfile separately.
      - run: bun install
      - run: npx --yes firebase-tools emulators:exec --only firestore "bun run test:rules"
