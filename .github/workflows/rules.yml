name: Firestore Rules CI

on:
  pull_request:
    branches: [ "*" ]

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The repository's bun.lock is currently out of sync with package.json.
      # Install from package.json so the rules tests can run; sync the lockfile separately.
      - run: bun install
      - name: Configure isolated default-database emulators
        run: |
          cat > firebase.rules-ci.json <<'EOF'
          {
            "firestore": { "rules": "firestore.rules" },
            "storage": { "rules": "storage.rules" },
            "emulators": {
              "firestore": { "port": 8088 },
              "storage": { "port": 9198 },
              "ui": { "enabled": false }
            }
          }
          EOF
      - run: npx --yes firebase-tools emulators:exec --only firestore --config firebase.rules-ci.json --project demo-hala-location-rules "node --test tests/locationRules.test.mjs"
      - run: npx --yes firebase-tools emulators:exec --only firestore --config firebase.rules-ci.json --project demo-hala-rule-diag "node --test tests/messageExpressionDiagnostic.test.mjs"
      - run: npx --yes firebase-tools emulators:exec --only firestore,storage --config firebase.rules-ci.json --project demo-hala-rules "bun run test:rules"
