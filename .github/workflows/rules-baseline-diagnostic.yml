name: Baseline Rules Diagnostic (main)
on:
  pull_request:
    branches: ["*"]
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install
      - run: npx --yes firebase-tools emulators:exec --only firestore,storage --project demo-hala-main-baseline --config firebase.ci.json "bun run test:rules"
