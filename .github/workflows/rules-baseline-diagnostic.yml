name: Baseline Rules Diagnostic (main)
on:
  pull_request:
    branches: ["*"]
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install
      - name: Create isolated emulator config
        run: |
          cat > firebase.baseline.ci.json <<'EOF'
          {
            "firestore": { "rules": "firestore.rules" },
            "storage": { "rules": "storage.rules" },
            "emulators": {
              "firestore": { "port": 8088 },
              "storage": { "port": 9198 },
              "ui": { "enabled": false }
            }
          }
          EOF
      - run: npx --yes firebase-tools emulators:exec --only firestore,storage --project demo-hala-main-baseline --config firebase.baseline.ci.json "bun run test:rules"
