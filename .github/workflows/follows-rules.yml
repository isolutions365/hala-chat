name: Follow Rules Focused CI

on:
  pull_request:
    branches: ["*"]
    paths:
      - "src/components/discover/FollowButton.tsx"
      - "tests/follows.test.mjs"
      - "firestore.rules"
      - ".github/workflows/follows-rules.yml"

jobs:
  follows-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install
      - name: Configure isolated Firestore emulator
        run: |
          cat > firebase.ci.json <<'EOF'
          {
            "firestore": { "rules": "firestore.rules" },
            "emulators": {
              "firestore": { "port": 8088 },
              "ui": { "enabled": false }
            }
          }
          EOF
      - name: Run follow security contract tests
        run: npx --yes firebase-tools emulators:exec --only firestore --config firebase.ci.json --project demo-hala-follows "node --test tests/follows.test.mjs"
