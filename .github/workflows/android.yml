name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d ' \t\n\r' | base64 --decode > android/app/google-services.json
            echo "google-services.json written ($(wc -c < android/app/google-services.json) bytes)"
            python3 -c "import json,sys; json.load(open('android/app/google-services.json')); print('JSON valid')"
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set, skipping"
          fi

      - name: Decode release keystore if configured
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\n\r' | base64 --decode > "$RUNNER_TEMP/hala-release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$RUNNER_TEMP/hala-release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK
        id: build_apk
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
         ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION_CODE=$((100 + ANDROID_VERSION_CODE))
          VERSION_NAME="1.0.${ANDROID_VERSION_CODE}"
          export ANDROID_VERSION_CODE="$VERSION_CODE"
          export ANDROID_VERSION_NAME="$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/hala-chat-latest.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/hala-chat-latest.apk"
          fi

      - name: Generate version.json for in-app updater
        run: |
          cat <<EOF > "$RUNNER_TEMP/version.json"
          {
            "versionCode": ${{ steps.build_apk.outputs.version_code }},
            "versionName": "${{ steps.build_apk.outputs.version_name }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/android-latest/hala-chat-latest.apk",
            "notes": "Tap Update to install Hala Chat v${{ steps.build_apk.outputs.version_name }}"
          }
          EOF

      - name: Publish latest APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest \
              "$RUNNER_TEMP/hala-chat-latest.apk" \
              "$RUNNER_TEMP/version.json" \
              --clobber
            gh release edit android-latest \
              --title "Hala Chat Android v${{ steps.build_apk.outputs.version_name }}" \
              --notes "Latest Android APK build (versionCode ${{ steps.build_apk.outputs.version_code }})."
          else
            gh release create android-latest \
              "$RUNNER_TEMP/hala-chat-latest.apk" \
              "$RUNNER_TEMP/version.json" \
              --target main \
              --title "Hala Chat Android v${{ steps.build_apk.outputs.version_name }}" \
              --notes "Latest Android APK build (versionCode ${{ steps.build_apk.outputs.version_code }})."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hala-chat-apk
          path: ${{ runner.temp }}/hala-chat-latest.apk
          if-no-files-found: error
